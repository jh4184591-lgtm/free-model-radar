name: free-model-radar
version: "0.6.0"
description: "Watch Nous + OpenRouter (+ optional Groq) free-tier models for window drift. Snapshots the free set from public /v1/models endpoints and reports new, vanished, or free-to-paid models, with fallback suggestions and countdowns for announced windows. AUTOMATICALLY switches the configured default to the best same-provider free model when the current one leaves the free list (uses the last of the free usage first); recommends switch targets; reports API-published retire dates; exports tracked windows + retire dates as an .ics calendar. Nous/OpenRouter keyless; Groq optional via GROQ_API_KEY. Provider outages never count as drift. $0."
author: Joshua Harrison
license: MIT
manifest_version: 1
kind: standalone
requires_hermes: ">=0.22.2"

provides_tools:
  - free_model_radar_status
  - free_model_radar_track
  - free_model_radar_recommend
  - free_model_radar_retire
  - free_model_radar_calendar
  - free_model_radar_auto_switch

provides_hooks: []
requires_env: []
